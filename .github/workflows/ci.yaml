name: CI-CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python app.py
      - run: python -m unittest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir deploy && cp app.py deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-app
          path: deploy